        selectEdge(domId);
        openInlineLabelEditor(anchorRect(), currentText, (newLabel, { viaEnter }) => {
          renameEdgeLabel(entry, newLabel, viaEnter);
        });
      }

      // --- Delete the current selection (Backspace/Delete) ---

      /**
       * Drops any note whose id (a node/subgraph id, or an edge's own explicit id) no
       * longer appears anywhere in the diagram — the note's element was deleted, so the
       * note has nothing left to be pinned to.
       */
      function pruneOrphanedNotes(source) {
        // Scan with the notes block itself stripped out — a note's own freeform text
        // (e.g. "fix A->B") must never be mistaken for real mermaid syntax and make an
        // actually-orphaned note look like its id still exists.
        const existingIds = extractExistingIds(stripNotes(source));
        let result = source;
        for (const key of parseNotes(source).keys()) {
          const [kind, id] = key.split(':');
          if (!existingIds.has(id)) {
            result = removeNote(result, kind, id);
          }
        }
        return result;
      }

      async function deleteSelection() {
        if (!selection) {
          return;
        }
        if (selection.kind === 'edge') {
          const entry = currentEdgeIndex.get(selection.domId);
          if (!entry) {
            return;
          }
          beginEdit();
          srcEl.value = removeEdgeSegment(srcEl.value, entry);
        } else {
          beginEdit();
          const el = findElementForId(currentSvg, selection.id);
          if (el?.classList.contains('cluster')) {
            srcEl.value = deleteSubgraphFromSource(srcEl.value, selection.id);
          } else {
            srcEl.value = removeNodeEdges(srcEl.value, selection.id);
            srcEl.value = removeNodeDeclarationLine(srcEl.value, selection.id);
          }
          srcEl.value = pruneEmptySubgraphs(srcEl.value);
        }
        // Both paths above can leave an id stranded on a line of its own — see
        // pruneRedundantBareLines for when that's worth keeping and when it's litter.
        srcEl.value = pruneRedundantBareLines(srcEl.value);
        srcEl.value = pruneOrphanedNotes(srcEl.value);
        clearSelection();
        clearTimeout(debounceID);
        await renderDiagram();
        saveProject();
      }

      function isEditableTarget(el) {
        return (
          !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)
        );
      }

      window.addEventListener('keydown', (e) => {
        if (!modalBackdrop.hidden || isEditableTarget(document.activeElement)) {
          return;
        }
        if ((e.key === 'Backspace' || e.key === 'Delete') && selection) {
          e.preventDefault();
          deleteSelection();
          return;
        }
        const mod = e.ctrlKey || e.metaKey;
        if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          undo();
        } else if (
          mod &&
          (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))
        ) {
          e.preventDefault();
          redo();
        }
      });

      // --- Per-element notes (node/edge/subgraph), stored in the source itself ---

      function openNotesPanel() {
        notesPanelEl.hidden = false;
        mainEl.classList.add('notes-open');
        renderNotesView();
      }
      function closeNotesPanel() {
        notesPanelEl.hidden = true;
        mainEl.classList.remove('notes-open');
      }
      notesPanelCloseBtn.addEventListener('click', closeNotesPanel);
      document.getElementById('notes-panel-open').addEventListener('click', openNotesPanel);
      etNoteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openNotesPanel();
      });

      function noteKindLabel(kind) {
        return kind === 'node' ? 'Node' : kind === 'subgraph' ? 'Subgraph' : 'Edge';
      }

      /**
       * What the *current* selection maps to for note purposes: a node/subgraph already
       * has a stable id; an edge only has one once a note has actually been saved on it
       * (`id: null` until then — `commitNote` mints one lazily, the first time it's
       * needed, rather than cluttering every edge with an id nobody asked for).
       */
      function currentSelectionNoteTarget() {
        if (!selection) {
          return null;
        }
        if (selection.kind === 'edge') {
          const entry = currentEdgeIndex.get(selection.domId);
          return entry ? { kind: 'edge', id: entry.edgeId ?? null, entry } : null;
        }
        const el = findElementForId(currentSvg, selection.id);
        return { kind: el?.classList.contains('cluster') ? 'subgraph' : 'node', id: selection.id };
      }

      // reselect=false for a plain blur (clicking elsewhere to leave the textarea) — that
      // click already has its own idea of what should now be selected (including empty
      // canvas, to deselect), and forcing this element back to selected here would race
      // it, same reasoning as openInlineLabelEditor's Enter-vs-blur split above.
      async function commitNote(target, text, reselect = true) {
        const key = target.id ? `${target.kind}:${target.id}` : null;
        const current = key ? (parseNotes(srcEl.value).get(key) ?? '') : '';
        if (current === text) {
          return;
        }
        beginEdit();
        let src = srcEl.value;
        let id = target.id;
        const trimmed = text.trim();
        if (target.kind === 'edge' && trimmed && !id) {
          id = nextAutoId(extractExistingIds(stripNotes(src)), 'note');
          src = assignEdgeId(src, target.entry, id);
        }
        if (id) {
          src = setNote(src, target.kind, id, text);
        }
        if (target.kind === 'edge' && !trimmed && target.id) {
          src = clearEdgeId(src, target.entry);
        }
        srcEl.value = src;
        clearTimeout(debounceID);
        await renderDiagram();
        // renderDiagram() clears `selection` itself, so re-select from `target` (captured
        // before that happened) rather than the now-stale live variable.
        if (reselect && (target.kind === 'node' || target.kind === 'subgraph')) {
          selectNode(target.id);
        } else if (reselect && target.kind === 'edge') {
          // The edge's dom id may have changed (just gained/lost its explicit id) —
          // re-derive it from the stable start/end/counter rather than the stale one.
          const match = Array.from(currentEdgeIndex.entries()).find(
            ([, e]) =>
              e.start === target.entry.start &&
              e.end === target.entry.end &&
              e.counter === target.entry.counter
          );
          if (match) {
            selectEdge(match[0]);
          }
        }
        if (!notesPanelEl.hidden) {
          renderNotesView();
        }
        saveProject();
      }

      function renderNotesList(notes) {
        if (notes.size === 0) {
          const p = document.createElement('p');
          p.className = 'notes-empty';
          p.textContent =
            'No notes yet. Select a node, edge, or subgraph and click "Add note" to create one.';
          notesViewEl.appendChild(p);
          return;
        }
        const list = document.createElement('div');
        list.className = 'notes-list';
        for (const [key, text] of notes) {
          const [kind, id] = key.split(':');
          const item = document.createElement('button');
          item.className = 'notes-list-item';
          const kindEl = document.createElement('span');
          kindEl.className = 'notes-list-kind';
          kindEl.textContent = noteKindLabel(kind);
          const idEl = document.createElement('span');
          idEl.className = 'notes-list-id';
          idEl.textContent = id;
          const snippetEl = document.createElement('span');
          snippetEl.className = 'notes-list-snippet';
          snippetEl.textContent = text.split('\n')[0];
          item.append(kindEl, idEl, snippetEl);
          item.addEventListener('click', () => {
            if (kind === 'edge') {
              const match = Array.from(currentEdgeIndex.entries()).find(([, e]) => e.edgeId === id);
              if (match) {
                selectEdge(match[0]);
              }
            } else {
              selectNode(id);
            }
          });
          list.appendChild(item);
        }
        notesViewEl.appendChild(list);
      }

      // The note editor currently on screen (there's at most one). Kept out here because
      // the drag-a-node-onto-the-notes gesture and the `@id` reference clicks both need to
      // reach it from outside renderNotesView's closure.
      let activeNote = null;
      let pendingNoteCommit = null;

      /** Repaints the click-through copy of the note's text that sits over the textarea. */
      function paintNoteBackdrop() {
        if (!activeNote) {
          return;
        }
        const knownIds = extractExistingIds(stripNotes(srcEl.value));
        // Trailing newline for the same reason the code panel needs one — see
        // updateCodeHighlight.
        const html = noteTextToHtml(activeNote.textarea.value, (id) => knownIds.has(id));
        activeNote.backdrop.innerHTML = `${html}\n`;
      }

      /**
       * Writes `@id` into the open note, at the caret — or at the end of the text, if the
       * textarea hasn't been clicked into yet. This is what a node dropped onto the notes
       * panel turns into.
       */
      function insertNoteRef(id) {
        if (!activeNote) {
          return;
        }
        const { textarea } = activeNote;
        const at = activeNote.caret ?? textarea.value.length;
        const before = textarea.value.slice(0, at);
        const after = textarea.value.slice(at);
        // Never glue the reference onto adjacent words — `@n3` has to stay its own token
        // for the parser (and the reader) to see it as a reference at all.
        const padBefore = before && !/\s$/.test(before) ? ' ' : '';
        const padAfter = after && !/^\s/.test(after) ? ' ' : '';
        const ref = `${padBefore}@${id}${padAfter}`;
        textarea.value = before + ref + after;
        const caret = before.length + ref.length;
        activeNote.caret = caret;
        textarea.focus();
        textarea.setSelectionRange(caret, caret);
        paintNoteBackdrop();
      }

      /** Jumps to whatever a note's `@id` reference points at — a node, subgraph or edge. */
      async function goToNoteRef(id) {
        // Clicking the reference blurred the textarea first, and that commits the note and
        // re-renders the diagram (which clears the selection). Let it finish, or the
        // re-render lands last and wipes the selection we're about to make.
        await pendingNoteCommit;
        if (!currentSvg) {
          return;
        }
        if (findElementForId(currentSvg, id)) {
          centerOnElement(id);
          selectNode(id);
          return;
        }
        const match = Array.from(currentEdgeIndex.entries()).find(([, e]) => e.edgeId === id);
        if (match) {
          selectEdge(match[0]);
        }
      }

      function renderNotesView() {
        notesViewEl.innerHTML = '';
        activeNote = null;
        const notes = parseNotes(srcEl.value);
        const target = currentSelectionNoteTarget();
        if (!target) {
          renderNotesList(notes);
          return;
        }

        const header = document.createElement('div');
        header.className = 'notes-detail-header';
        header.textContent = `${noteKindLabel(target.kind)} · ${target.id ?? '(new note)'}`;

        const editor = document.createElement('div');
        editor.className = 'note-editor';
        const textarea = document.createElement('textarea');
        textarea.className = 'notes-textarea';
        textarea.placeholder = 'Write a note…  (drag a node in to reference it)';
        textarea.value = target.id ? (notes.get(`${target.kind}:${target.id}`) ?? '') : '';
        const backdrop = document.createElement('div');
        backdrop.className = 'note-backdrop';
        backdrop.setAttribute('aria-hidden', 'true');
        editor.append(textarea, backdrop);
        activeNote = { textarea, backdrop, editor, caret: null };
        paintNoteBackdrop();

        textarea.addEventListener('input', () => {
          activeNote.caret = textarea.selectionStart;
          paintNoteBackdrop();
        });
        textarea.addEventListener('scroll', () => {
          backdrop.scrollTop = textarea.scrollTop;
          backdrop.scrollLeft = textarea.scrollLeft;
        });
        // The caret is remembered rather than read on demand: by the time a dragged node is
        // dropped, focus has long since left the textarea and selectionStart has moved.
        for (const event of ['click', 'keyup', 'select']) {
          textarea.addEventListener(event, () => {
            activeNote.caret = textarea.selectionStart;
          });
        }
        // On pointerdown, not click. Pressing a reference blurs the textarea, and that
        // commit re-renders the whole panel — so by the time a click event would be
        // dispatched, the span that was pressed is gone and the click lands on whatever
        // replaced it. Taking the press instead, and doing the commit here explicitly
        // (preventDefault keeps focus put, so no blur races us), makes the order fixed:
        // save the note, then navigate.
        backdrop.addEventListener('pointerdown', (e) => {
          const ref = e.target.closest?.('.note-ref');
          if (!ref) {
            return;
          }
          e.preventDefault();
          doCommit(textarea.value, false);
          goToNoteRef(ref.dataset.refId);
        });

        // A successful commit re-renders this whole panel (renderNotesView wipes
        // notesViewEl and rebuilds it), which removes this still-focused textarea from
        // the DOM — and *that* fires a native blur on it, invoking this same closure's
        // blur handler again with the same (now stale) target. This flag makes sure only
        // the first of any of these ever actually commits, same idiom as
        // openInlineLabelEditor's `done`.
        let committed = false;
        function doCommit(text, reselect) {
          if (committed) return;
          committed = true;
          pendingNoteCommit = commitNote(target, text, reselect);
        }

        const actions = document.createElement('div');
        actions.className = 'notes-detail-actions';
        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove note';
        removeBtn.hidden = !textarea.value;
        removeBtn.addEventListener('click', () => {
          textarea.value = '';
          doCommit('', true);
        });
        actions.appendChild(removeBtn);

        textarea.addEventListener('blur', () => doCommit(textarea.value, false));
        textarea.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            doCommit(textarea.value, true);
          }
        });

        notesViewEl.append(header, editor, actions);
      }

      /** A small badge near every noted node/subgraph/edge — visible without selecting it. */
      function drawNoteBadges(svg) {
        const notes = parseNotes(srcEl.value);
        if (notes.size === 0) {
          return;
        }
        const ns = 'http://www.w3.org/2000/svg';
        const layer = document.createElementNS(ns, 'g');
        layer.id = 'note-badges';
        for (const key of notes.keys()) {
          const [kind, id] = key.split(':');
          let point;
          if (kind === 'edge') {
            // An edge's own label shares the same data-id as the edge itself (its
            // explicit id, or mermaid's auto `L_...` one) — anchoring the badge just off
            // its top-right corner keeps the label wherever mermaid would normally put
            // it, without covering it. But mermaid only actually positions that group
            // when there's real label text — an edge with no label gets one anyway, left
            // untransformed at the SVG's own origin — so an empty label falls back to the
            // path's own midpoint instead of landing wherever that origin happens to be.
            const labelEl = svg.querySelector(`g.label[data-id="${CSS.escape(id)}"]`);
            const labelBox = labelEl ? bboxInSvgSpace(labelEl, svg) : null;
            if (labelBox && labelBox.width > 0) {
              point = { x: labelBox.x + labelBox.width, y: labelBox.y };
            } else {
              const pathEl = svg.getElementById(`${svg.id}-${id}`);
              if (!pathEl) {
                continue;
              }
              point = pathEl.getPointAtLength(pathEl.getTotalLength() / 2);
            }
          } else {
            const el = findElementForId(svg, id);
            if (!el) {
              continue;
            }
            const b = bboxInSvgSpace(el, svg);
            point = { x: b.x + b.width - 2, y: b.y + 2 };
          }
          const badge = document.createElementNS(ns, 'g');
          badge.classList.add('note-badge');
          // Anchor kept on the element itself: applyOverlayScale rebuilds this transform
          // on every zoom so the badge keeps its size in screen pixels.
          badge.dataset.x = point.x;
          badge.dataset.y = point.y;
          badge.setAttribute('transform', `translate(${point.x}, ${point.y})`);
          badge.innerHTML = `
            <circle r="6.5" fill="#f4b740" stroke="#0b1020" stroke-width="1.2"/>
            <line x1="-3" y1="-2.2" x2="3" y2="-2.2" stroke="#0b1020" stroke-width="1" stroke-linecap="round"/>
            <line x1="-3" y1="0" x2="3" y2="0" stroke="#0b1020" stroke-width="1" stroke-linecap="round"/>
            <line x1="-3" y1="2.2" x2="1" y2="2.2" stroke="#0b1020" stroke-width="1" stroke-linecap="round"/>
          `;
          layer.appendChild(badge);
        }
        svg.appendChild(layer);
      }

      etShapeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selection || selection.kind !== 'node') {
          return;
        }
        shapePopoverMode = 'change';
        shapePopoverTargetId = selection.id;
        const decl = findNodeDeclaration(srcEl.value, selection.id);
        for (const btn of shapePopover.children) {
          btn.classList.toggle('active', btn.dataset.shapeKey === decl?.shapeKey);
        }
        // .canvas-toolbar (shapePopover's default parent) has a CSS transform for its own
        // vertical centering — any transformed ancestor makes `position: fixed` descendants
        // position relative to IT instead of the viewport, so this must live outside it.
        document.body.appendChild(shapePopover);
        shapePopover.style.position = 'fixed';
        openFloatingPopover(shapePopover, etShapeBtn);
      });

      etSubgraphBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        convertSelectionToSubgraph();
      });

      etMoveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (moveMenu.hidden) {
          openMoveMenu();
        } else {
          moveMenu.hidden = true;
        }
      });

      etArrowBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openArrowPopoverForSelection();
      });

      etCodeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        viewSelectionInCode();
      });

      // --- Click a node/edge to select it; drag an edge's endpoint to reassign it ---
      const SELECT_COLOR = '#4f8cff';
      const EDGE_HIT_WIDTH = 14;

      /*
       * Every overlay this file draws lives inside the SVG, in the diagram's own user space
       * — so it shrinks right along with the diagram as you zoom out, and at a wide zoom
       * the "+" button and the edge handles become sub-pixel targets nobody can hit. Each
       * overlay registers how to re-draw itself for a given `k` (svg user units per screen
       * pixel) and every pan/zoom re-applies them, so a 2px ring stays 2px and an 11px
       * button stays an 11px button at any zoom.
       */
      let scaledOverlays = [];

      function overlayScale() {
        const ctm = currentSvg?.getScreenCTM();
        return ctm?.a ? 1 / ctm.a : 1;
      }

      /** Registers `apply(k)`, runs it once, and returns a function to unregister it. */
      function addScaledOverlay(apply) {
        scaledOverlays.push(apply);
        apply(overlayScale());
        return () => {
          scaledOverlays = scaledOverlays.filter((fn) => fn !== apply);
        };
      }

      function applyOverlayScale() {
        if (!currentSvg) {
          return;
        }
        const k = overlayScale();
        for (const apply of scaledOverlays) {
          apply(k);
        }
        // Not selection overlays, but the same problem: an edge's invisible click target is
        // useless once it shrinks to a hairline, and a note badge becomes an unreadable
        // speck. Both are redrawn per render, so they're scaled here rather than registered.
        for (const hit of currentSvg.querySelectorAll('.edge-hit-area')) {
          hit.style.strokeWidth = `${EDGE_HIT_WIDTH * k}`;
        }
        for (const badge of currentSvg.querySelectorAll('#note-badges > g')) {
          badge.setAttribute(
            'transform',
            `translate(${badge.dataset.x}, ${badge.dataset.y}) scale(${k})`
          );
        }
      }

      function nodeIdFromElement(el) {
        const m = /-flowchart-(.+)-\d+$/.exec(el.id);
        return m ? m[1] : null;
      }

      /** Subgraphs render as `g.cluster` with dom id `{svgId}-{subgraphId}` — no other suffix. */
      function clusterIdFromElement(el) {
        if (!currentSvg?.id || !el.classList.contains('cluster')) {
          return null;
        }
        const prefix = `${currentSvg.id}-`;
        return el.id.startsWith(prefix) ? el.id.slice(prefix.length) : null;
      }

      /** A node or a subgraph — anything selectable/linkable as a diagram element. */
      function selectableIdFromElement(el) {
        return nodeIdFromElement(el) ?? clusterIdFromElement(el);
      }

      function selectionLayer() {
        let layer = currentSvg.querySelector('#selection-layer');
        if (!layer) {
          layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          layer.id = 'selection-layer';
          currentSvg.appendChild(layer);
        }
        return layer;
      }

      function clearSelection() {
        selection = null;
        const layer = currentSvg?.querySelector('#selection-layer');
        if (layer) {
          layer.innerHTML = '';
        }
        scaledOverlays = [];
        hideElementToolbar();
        if (!notesPanelEl.hidden) {
          renderNotesView();
        }
      }

      /**
       * Ensures every edge has a wide, invisible sibling path so it's easy to click —
       * mermaid's real line is only ~1-2px. The clone inherits classes like
       * edge-thickness-normal, whose CSS `stroke-width`/`stroke` rules win over a plain
       * attribute (presentation attributes are the lowest-priority source in the SVG/CSS
       * cascade), so this drops those classes and sets geometry via inline style instead.
       */
      function widenEdgeHitAreas(svg) {
        for (const path of svg.querySelectorAll('path.flowchart-link')) {
          const hit = path.cloneNode(false);
          hit.removeAttribute('id');
          hit.removeAttribute('class');
          hit.removeAttribute('style');
          hit.classList.add('edge-hit-area');
          hit.style.fill = 'none';
          hit.style.stroke = 'transparent';
          hit.style.strokeWidth = `${EDGE_HIT_WIDTH}`;
          hit.dataset.forEdge = path.id;
          path.insertAdjacentElement('afterend', hit);
        }
      }

      function drawNodeSelection(nodeId) {
        const el = findElementForId(currentSvg, nodeId);
        if (!el) {
          return;
        }
        const b = bboxInSvgSpace(el, currentSvg);
        const layer = selectionLayer();
        const ns = 'http://www.w3.org/2000/svg';

        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('fill', 'none');
        rect.setAttribute('stroke', SELECT_COLOR);
        rect.style.pointerEvents = 'none';
        addScaledOverlay((k) => {
          const pad = 4 * k;
          rect.setAttribute('x', b.x - pad);
          rect.setAttribute('y', b.y - pad);
          rect.setAttribute('width', b.width + pad * 2);
          rect.setAttribute('height', b.height + pad * 2);
          rect.setAttribute('rx', 6 * k);
          rect.setAttribute('stroke-width', 2 * k);
        });
        layer.appendChild(rect);

        const plus = document.createElementNS(ns, 'g');
        plus.style.cursor = 'pointer';
        addScaledOverlay((k) => {
          plus.setAttribute(
            'transform',
            `translate(${b.x + b.width / 2}, ${b.y + b.height + 18 * k}) scale(${k})`
          );
        });
        plus.innerHTML = `
          <circle r="11" fill="${SELECT_COLOR}" stroke="#0b1020" stroke-width="1.5"/>
          <line x1="-5" y1="0" x2="5" y2="0" stroke="#0b1020" stroke-width="2" stroke-linecap="round"/>
          <line x1="0" y1="-5" x2="0" y2="5" stroke="#0b1020" stroke-width="2" stroke-linecap="round"/>
        `;
        plus.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          startPlusDrag(e, nodeId);
        });
        layer.appendChild(plus);
        raiseNoteBadges();
      }

      /** Keeps note badges on top of whatever selection/label z-order shuffling just happened. */
      function raiseNoteBadges() {
        const badgesLayer = currentSvg?.querySelector('#note-badges');
        if (badgesLayer) {
          currentSvg.appendChild(badgesLayer);
        }
      }

      function addHandle(layer, point, which, entry) {
        const ns = 'http://www.w3.org/2000/svg';
        const handle = document.createElementNS(ns, 'circle');
        handle.setAttribute('cx', point.x);
        handle.setAttribute('cy', point.y);
        handle.setAttribute('fill', SELECT_COLOR);
        handle.setAttribute('stroke', '#0b1020');
        handle.style.cursor = 'grab';
        addScaledOverlay((k) => {
          handle.setAttribute('r', 7 * k);
          handle.setAttribute('stroke-width', 2 * k);
        });
        handle.addEventListener('pointerdown', (e) => startHandleDrag(e, entry, which, point));
        layer.appendChild(handle);
      }

      /**
       * A self-loop (`D --> D`) renders as several path.flowchart-link segments sharing an
       * `{id}-cyclic-special-` id prefix instead of mermaid's usual single path per edge.
       * Returns every segment of `pathEl`'s loop (in document/draw order), or just `[pathEl]`
       * for a normal edge — so selection highlighting/handle placement can treat both uniformly.
       */
      function edgeSegmentGroup(pathEl) {
        const loopPrefix = /^(.*-cyclic-special-)/.exec(pathEl.id)?.[1];
        if (!loopPrefix) {
          return [pathEl];
        }
        return Array.from(currentSvg.querySelectorAll('path.flowchart-link')).filter((el) =>
          el.id.startsWith(loopPrefix)
        );
      }

      function drawEdgeSelection(domId) {
        const pathEl = currentSvg.querySelector(`[id="${CSS.escape(domId)}"]`);
        if (!pathEl) {
          return;
        }
        const layer = selectionLayer();
        const ns = 'http://www.w3.org/2000/svg';
        const segments = edgeSegmentGroup(pathEl);

        for (const seg of segments) {
          const highlight = document.createElementNS(ns, 'path');
          highlight.setAttribute('d', seg.getAttribute('d'));
          highlight.setAttribute('fill', 'none');
          highlight.setAttribute('stroke', SELECT_COLOR);
          highlight.setAttribute('stroke-linecap', 'round');
          highlight.style.pointerEvents = 'none';
          addScaledOverlay((k) => highlight.setAttribute('stroke-width', 3 * k));
          layer.appendChild(highlight);
        }

        const entry = currentEdgeIndex.get(domId);
        // #selection-layer is the last child of the svg, so it paints over everything
        // before it — including this edge's own label, right where the highlight crosses
        // it. Move the label's group to the very end too, so its text stays on top and
        // legible instead of sitting under the highlight.
        const labelGroup = entry
          ? currentSvg
              .querySelector(`g.label[data-id="${CSS.escape(edgeIdSuffix(entry))}"]`)
              ?.closest('.edgeLabel')
          : null;
        if (labelGroup) {
          currentSvg.appendChild(labelGroup);
        }
        raiseNoteBadges();

        if (!entry?.startSpan) {
          return; // selectable (and its arrow may still support retyping), but endpoints aren't safe to drag
        }
        // The true endpoints of a (possibly multi-segment) edge are the very start of its
        // first segment and the very end of its last — for a normal edge that's just pathEl
        // itself, since segments here is [pathEl].
        const firstSeg = segments[0];
        const lastSeg = segments[segments.length - 1];
        addHandle(layer, firstSeg.getPointAtLength(0), 'start', entry);
        addHandle(layer, lastSeg.getPointAtLength(lastSeg.getTotalLength()), 'end', entry);
      }

      function selectNode(nodeId) {
        clearSelection();
        selection = { kind: 'node', id: nodeId };
        drawNodeSelection(nodeId);
        showElementToolbarForNode(nodeId);
        if (!notesPanelEl.hidden) {
          renderNotesView();
        }
      }

      function selectEdge(domId) {
        clearSelection();
        selection = { kind: 'edge', domId };
        drawEdgeSelection(domId);
        showElementToolbarForEdge(domId);
        if (!notesPanelEl.hidden) {
          renderNotesView();
        }
      }

      /**
       * Auto-pans the viewport while a drag's pointer sits near its edge, so dragging an
       * edge endpoint (or the "+" link handle) can reach a node currently off-screen.
       * `onTick(clientX, clientY)` re-runs on every pan step — even without a new pointer
       * event — so the caller's own drag visuals (rubber-band line, hover target) stay in
       * sync with content that just scrolled under an otherwise-stationary cursor.
       */
      function createEdgeAutopan(onTick) {
        const MARGIN = 48;
        const MAX_SPEED = 22;
        let vx = 0;
        let vy = 0;
        let lastX = 0;
        let lastY = 0;
        let rafId = null;

        function edgeSpeed(pos, size) {
          if (pos < MARGIN) {
            return MAX_SPEED * (1 - pos / MARGIN);
          }
          if (pos > size - MARGIN) {
            return -MAX_SPEED * (1 - (size - pos) / MARGIN);
          }
          return 0;
        }

        function frame() {
          panzoom.panBy(vx, vy);
          onTick(lastX, lastY);
          rafId = requestAnimationFrame(frame);
        }

        function update(clientX, clientY) {
          lastX = clientX;
          lastY = clientY;
          const rect = viewportEl.getBoundingClientRect();
          vx = edgeSpeed(clientX - rect.left, rect.width);
          vy = edgeSpeed(clientY - rect.top, rect.height);
          if ((vx || vy) && rafId === null) {
            rafId = requestAnimationFrame(frame);
          } else if (!vx && !vy && rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        }

        function stop() {
          vx = 0;
          vy = 0;
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        }

        return { update, stop };
      }

      /**
       * The topmost node/subgraph at a screen point, looking *through* the overlays this
       * file draws on top of the diagram — chiefly the invisible 14px-wide edge click
       * targets, which criss-cross a group's interior and would otherwise swallow every
       * drop aimed at it.
       */
      function elementUnderPoint(clientX, clientY) {
        for (const el of document.elementsFromPoint(clientX, clientY)) {
          if (el.closest?.('#selection-layer') || el.classList?.contains('edge-hit-area')) {
            continue;
          }
          const match = el.closest?.('g.node, g.cluster');
          if (match) {
            return match;
          }
        }
        return null;
      }

      function startHandleDrag(e, entry, which, fixedPoint) {
        e.stopPropagation();
        e.preventDefault();
        const layer = selectionLayer();
        const ns = 'http://www.w3.org/2000/svg';
        const rubberBand = document.createElementNS(ns, 'line');
        rubberBand.setAttribute('x1', fixedPoint.x);
        rubberBand.setAttribute('y1', fixedPoint.y);
        rubberBand.setAttribute('x2', fixedPoint.x);
        rubberBand.setAttribute('y2', fixedPoint.y);
        rubberBand.setAttribute('stroke', SELECT_COLOR);
        rubberBand.style.pointerEvents = 'none';
        const unscaleRubberBand = addScaledOverlay((k) => {
          rubberBand.setAttribute('stroke-width', 2 * k);
          rubberBand.setAttribute('stroke-dasharray', `${4 * k} ${3 * k}`);
        });
        layer.appendChild(rubberBand);

        let hoverTarget = null;

        // fixedPoint (x1/y1) is in the svg's own user-space (from pathEl.getPointAtLength),
        // so x2/y2 must be too — panzoom.clientToContent only undoes the pan/zoom CSS
        // transform, not the svg's own viewBox-to-rendered-size scale, which is a different
        // factor whenever the svg's rendered size doesn't happen to equal its viewBox 1:1.
        function updateVisual(clientX, clientY) {
          const p = clientToSvgPoint(currentSvg, clientX, clientY);
          rubberBand.setAttribute('x2', p.x);
          rubberBand.setAttribute('y2', p.y);

          const nodeEl = elementUnderPoint(clientX, clientY);
          if (nodeEl !== hoverTarget) {
            hoverTarget?.classList.remove('drop-candidate');
            hoverTarget = nodeEl;
            hoverTarget?.classList.add('drop-candidate');
          }
        }

        const autopan = createEdgeAutopan(updateVisual);

        function onMove(ev) {
          updateVisual(ev.clientX, ev.clientY);
          autopan.update(ev.clientX, ev.clientY);
        }

        function onUp(ev) {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          autopan.stop();
          hoverTarget?.classList.remove('drop-candidate');
          rubberBand.remove();
          unscaleRubberBand();

          const nodeEl = elementUnderPoint(ev.clientX, ev.clientY);
          const droppedId = nodeEl ? selectableIdFromElement(nodeEl) : null;
          const currentId = which === 'start' ? entry.start : entry.end;

          if (droppedId && droppedId !== currentId) {
            beginEdit();
            srcEl.value = rewriteEdgeEndpoint(srcEl.value, entry, which, droppedId);
            clearSelection();
            // Meant to swallow a synthetic click some browsers fire after a drag-drop like this
            // — but that click isn't guaranteed (pointerdown was on the handle, pointerup lands
            // wherever the pointer is, and browsers don't always synthesize one across different
            // targets), so the flag can't be left waiting on it indefinitely: that just eats the
            // next *real* click instead. Auto-clear it shortly after if nothing consumed it.
            suppressNextClick = true;
            clearTimeout(suppressNextClickTimeout);
            suppressNextClickTimeout = setTimeout(() => {
              suppressNextClick = false;
            }, 300);
            clearTimeout(debounceID);
            renderDiagram().then(saveProject);
          }
        }

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      }

      // Clicking a node's "+" asks what to create — a node or a subgraph — and then, like
      // every other creation path in this editor, offers to name it. Deliberately no shape
      // picker here: the shape of a brand new node is a detail you change afterwards from
      // its own toolbar, and asking for it up front turns one click into three.
      const plusMenu = document.getElementById('plus-menu');
      let plusMenuSourceId = null;

      function openPlusMenu(clientX, clientY, sourceId) {
        plusMenuSourceId = sourceId;
        plusMenu.hidden = false;
        const w = plusMenu.offsetWidth;
        const h = plusMenu.offsetHeight;
        plusMenu.style.left = `${Math.min(Math.max(8, clientX - w / 2), window.innerWidth - w - 8)}px`;
        plusMenu.style.top = `${Math.min(clientY + 10, window.innerHeight - h - 8)}px`;
      }

      function closePlusMenu() {
        plusMenu.hidden = true;
        plusMenuSourceId = null;
      }

      /**
       * What a "+" means depends on what it's hanging off. On a node it makes a sibling and
       * wires an edge to it. On a subgraph it fills the subgraph — creating inside it, with
       * no edge, because a group pointing an arrow at its own member is nobody's intent.
       * (Connecting a subgraph to something new is still a drag of the "+" onto it.)
       */
      function plusMenuTarget() {
        const sourceId = plusMenuSourceId;
        const el = sourceId ? findElementForId(currentSvg, sourceId) : null;
        return el?.classList.contains('cluster')
          ? { insideOf: sourceId, inside: true }
          : { connectFrom: sourceId, inside: false };
      }

      document.getElementById('plus-menu-node').addEventListener('click', () => {
        const target = plusMenuTarget();
        closePlusMenu();
        openModal({
          kind: 'node',
          shape: SHAPES[0],
          label: 'Node',
          title: target.inside ? 'New node inside' : 'New node',
          ...target,
        });
      });

      document.getElementById('plus-menu-subgraph').addEventListener('click', () => {
        const target = plusMenuTarget();
        closePlusMenu();
        openModal({
          kind: 'subgraph',
          title: target.inside ? 'New subgraph inside' : 'New subgraph',
          ...target,
        });
      });

      async function linkExistingNodes(sourceId, targetId) {
        beginEdit();
        srcEl.value = appendToDiagram(srcEl.value, [`  ${sourceId} --> ${targetId}`]);
        clearSelection();
        clearTimeout(debounceID);
        await renderDiagram();
        saveProject();
      }

      // Dragging the "+" onto an existing node links source->that node (no new node
      // created); dropping on empty canvas, or a plain click with no real movement,
      // falls back to the old behavior of spawning a brand new connected node.
      function startPlusDrag(e, sourceId) {
        e.preventDefault();
        const startClientX = e.clientX;
        const startClientY = e.clientY;
        const layer = selectionLayer();
        const ns = 'http://www.w3.org/2000/svg';
        const startPoint = clientToSvgPoint(currentSvg, startClientX, startClientY);
        const rubberBand = document.createElementNS(ns, 'line');
        rubberBand.setAttribute('x1', startPoint.x);
        rubberBand.setAttribute('y1', startPoint.y);
        rubberBand.setAttribute('x2', startPoint.x);
        rubberBand.setAttribute('y2', startPoint.y);
        rubberBand.setAttribute('stroke', SELECT_COLOR);
        rubberBand.style.pointerEvents = 'none';
        rubberBand.hidden = true;
        const unscaleRubberBand = addScaledOverlay((k) => {
          rubberBand.setAttribute('stroke-width', 2 * k);
          rubberBand.setAttribute('stroke-dasharray', `${4 * k} ${3 * k}`);
        });
        layer.appendChild(rubberBand);

        let hoverTarget = null;
        let dragging = false;
        const DRAG_THRESHOLD = 5;

        function updateVisual(clientX, clientY) {
          rubberBand.hidden = false;
          const p = clientToSvgPoint(currentSvg, clientX, clientY);
          rubberBand.setAttribute('x2', p.x);
          rubberBand.setAttribute('y2', p.y);

          const nodeEl = elementUnderPoint(clientX, clientY);
          const candidate = nodeEl && selectableIdFromElement(nodeEl) !== sourceId ? nodeEl : null;
          if (candidate !== hoverTarget) {
            hoverTarget?.classList.remove('drop-candidate');
            hoverTarget = candidate;
            hoverTarget?.classList.add('drop-candidate');
          }
        }

        const autopan = createEdgeAutopan(updateVisual);

        function onMove(ev) {
          if (
            !dragging &&
            Math.hypot(ev.clientX - startClientX, ev.clientY - startClientY) < DRAG_THRESHOLD
          ) {
            return;
          }
          dragging = true;
          updateVisual(ev.clientX, ev.clientY);
          autopan.update(ev.clientX, ev.clientY);
        }

        function onUp(ev) {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          autopan.stop();
          hoverTarget?.classList.remove('drop-candidate');
          rubberBand.remove();
          unscaleRubberBand();

          if (!dragging) {
            // Deferred a tick so the click this pointerup is about to produce goes by
            // first — the document-level "click outside closes popovers" handler would
            // otherwise close the menu the very gesture that opened it.
            setTimeout(() => openPlusMenu(ev.clientX, ev.clientY, sourceId), 0);
            return;
          }

          // Same as the edge-handle drag: pointerdown's preventDefault means a
          // browser-synthesized click landing on real diagram content (not our
          // overlay) isn't guaranteed, so don't leave the flag waiting on it forever.
          suppressNextClick = true;
          clearTimeout(suppressNextClickTimeout);
          suppressNextClickTimeout = setTimeout(() => {
            suppressNextClick = false;
          }, 300);

          const nodeEl = elementUnderPoint(ev.clientX, ev.clientY);
          const droppedId = nodeEl ? selectableIdFromElement(nodeEl) : null;
          if (droppedId && droppedId !== sourceId) {
            linkExistingNodes(sourceId, droppedId);
          }
          // Dropped on empty canvas (or back on the source node) — a real drag that
          // didn't land on a target does nothing, unlike a plain click.
        }

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      }

      // Capture phase: hotpaths.ts calls stopPropagation() on node clicks (for its own
      // pin-toggle), which would otherwise stop this from ever seeing the click — capturing
      // ancestors run before that. Clicks on our own overlay (the "+" button, drag handles)
      // are left alone so their own listeners get to run.
      diagramEl.addEventListener(
        'click',
        (e) => {
          if (suppressNextClick) {
            suppressNextClick = false;
            clearTimeout(suppressNextClickTimeout);
            return;
          }
          if (e.target.closest?.('#selection-layer')) {
            return;
          }
          const nodeEl = e.target.closest?.('g.node, g.cluster');
          if (nodeEl) {
            const nid = selectableIdFromElement(nodeEl);
            if (nid) {
              selectNode(nid);
              return;
            }
          }
          const hit = e.target.closest?.('.edge-hit-area');
          if (hit) {
            selectEdge(hit.dataset.forEdge);
            return;
          }
          const edgeEl = e.target.closest?.('path.flowchart-link');
          if (edgeEl) {
            selectEdge(edgeEl.id);
            return;
          }
          clearSelection();
        },
        true
      );

      // Double-click a node/subgraph to rename its label in place; double-click an edge
      // to add/edit its label. Same capture-phase reasoning as the click listener above.
      diagramEl.addEventListener(
        'dblclick',
        (e) => {
          const nodeEl = e.target.closest?.('g.node, g.cluster');
          if (nodeEl) {
            const nid = selectableIdFromElement(nodeEl);
            if (nid) {
              e.stopPropagation();
              startNodeLabelEdit(nid, nodeEl);
            }
            return;
          }
          const hit = e.target.closest?.('.edge-hit-area');
          const edgeEl = e.target.closest?.('path.flowchart-link');
          const domId = hit?.dataset.forEdge ?? edgeEl?.id;
          if (domId) {
            e.stopPropagation();
            startEdgeLabelEdit(domId);
          }
        },
        true
      );

      // --- Drag an element: into a subgraph to nest it, or into the open note to cite it ---
      const dragChip = document.getElementById('drag-chip');

      /**
       * One gesture, two possible drops. Dragging a node or subgraph onto another subgraph
       * nests it there; dragging it onto the open note writes an `@id` reference into the
       * text. Both hang off a plain pointerdown on the element (nothing else on the canvas
       * drags one) and only engage once the pointer has really moved, so a normal click
       * still just selects, and a drag that lands on neither target does nothing at all.
       */
      function startElementDrag(e, id) {
        // Canceling pointerdown suppresses the compatibility mousedown, and with it the
        // focus change it would cause. That matters more than it sounds: moving focus off
        // the note's textarea fires its blur, which commits the note and re-renders the
        // diagram — tearing down the very editor a note drag is aiming at, mid-gesture.
        e.preventDefault();
        const startX = e.clientX;
        const startY = e.clientY;
        let dragging = false;
        let hoverCluster = null;

        // Read once: which subgraph this element is already in, and what lives inside it —
        // a subgraph can't be dropped into itself or into its own descendants.
        const strippedSource = stripNotes(srcEl.value);
        const currentParent = findEnclosingSubgraph(strippedSource, id);
        const ownDescendants = idsInsideSubgraph(srcEl.value, id);

        function overNoteEditor(clientX, clientY) {
          const under = document.elementFromPoint(clientX, clientY);
          return !!under && !!activeNote?.editor.contains(under);
        }

        /** The subgraph element a drop here would nest into, or null. */
        function clusterUnder(clientX, clientY) {
          const under = elementUnderPoint(clientX, clientY);
          let clusterEl = under?.classList.contains('cluster') ? under : null;
          if (!clusterEl && under) {
            // Dropping onto a node that sits in a group reads as "into that group" — a
            // group's own background is often a sliver behind its members.
            const overId = nodeIdFromElement(under);
            const parentOfHovered =
              overId && overId !== id ? findEnclosingSubgraph(strippedSource, overId) : null;
            clusterEl = parentOfHovered ? findElementForId(currentSvg, parentOfHovered) : null;
          }
          const targetId = clusterEl ? clusterIdFromElement(clusterEl) : null;
          if (!targetId || targetId === id || targetId === currentParent) {
            return null;
          }
          return ownDescendants.has(targetId) ? null : clusterEl;
        }

        function updateVisual(clientX, clientY) {
          dragChip.hidden = false;
          dragChip.style.left = `${clientX + 12}px`;
          dragChip.style.top = `${clientY + 12}px`;
          const onNote = overNoteEditor(clientX, clientY);
          dragChip.textContent = onNote ? `@${id}` : id;
          activeNote?.editor.classList.toggle('drop-target', onNote);

          const candidate = onNote ? null : clusterUnder(clientX, clientY);
          if (candidate !== hoverCluster) {
            hoverCluster?.classList.remove('drop-candidate');
            hoverCluster = candidate;
            hoverCluster?.classList.add('drop-candidate');
          }
        }

        function onMove(ev) {
          if (!dragging && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) {
            return;
          }
          dragging = true;
          updateVisual(ev.clientX, ev.clientY);
        }

        function onUp(ev) {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          dragChip.hidden = true;
          activeNote?.editor.classList.remove('drop-target');
          const dropCluster = hoverCluster;
          hoverCluster?.classList.remove('drop-candidate');
          if (!dragging) {
            return;
          }
          // A finished drag must not also read as a click: selecting the dragged element
          // would swap the notes panel over to *its* note right as the reference lands in
          // the one being written, and re-select what a move is about to re-render anyway.
          suppressNextClick = true;
          clearTimeout(suppressNextClickTimeout);
          suppressNextClickTimeout = setTimeout(() => {
            suppressNextClick = false;
          }, 300);

          if (overNoteEditor(ev.clientX, ev.clientY)) {
            insertNoteRef(id);
            return;
          }
          const targetId = dropCluster ? clusterIdFromElement(dropCluster) : null;
          if (targetId) {
            moveElementInto(id, targetId);
          }
        }

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      }

      // Capture phase, same reasoning as the click listener above.
      diagramEl.addEventListener(
        'pointerdown',
        (e) => {
          if (e.button !== 0) {
            return;
          }
          // Resolved by point rather than by e.target: an edge's invisible click target is
          // wide enough to sit over a subgraph's own title, and pressing there is a press
          // on the subgraph as far as anyone can tell by looking.
          const nodeEl = elementUnderPoint(e.clientX, e.clientY);
          const nodeId = nodeEl ? selectableIdFromElement(nodeEl) : null;
          if (nodeId) {
            startElementDrag(e, nodeId);
          }
        },
        true
      );

      srcEl.addEventListener('input', scheduleAutosave);
      nameEl.addEventListener('input', scheduleAutosave);

      async function boot() {
        const project = await getProject(id);
        if (!project) {
          window.location.href = './index.html';
          return;
        }
        nameEl.value = project.name;
        srcEl.value = project.code;
        hotpathsEnabled = project.hotpathsEnabled ?? true;
        applyHotpathsToggleUI();
        if (project.layout === 'elk') {
          layoutSelect.value = 'elk';
          await ensureLayoutRegistered('elk');
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: 'base',
            themeVariables: THEME_VARIABLES,
            flowchart: { curve: 'basis' },
            layout: 'elk',
          });
        }
        if (project.view) {
          await renderDiagram();
          panzoom.setView(project.view);
        } else {
          renderDiagram({ refit: true });
        }
      }

      if (id) {
        boot();
      }
    </script>
  </body>
</html>
